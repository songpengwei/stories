<!doctype html>
<html lang="zh-CN" data-theme="muniao">
<head>
  <meta charset="utf-8">
  <title>这座墓里，藏着遥远的北齐 · 木鸟杂记</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../../shared/editorial.css">
  <link rel="stylesheet" href="../../../shared/flip-viewer.css">
  <style>
    /* 本故事的 task-scoped 样式；共享模板样式见 ../../../shared/editorial.css。
       页面结构由 layout.js（window.LAYOUT，绝对定位 block）在 body 末尾动态生成，
       与 xiaohongshu/xuxianxiu 的 editor.html 共用同一套 .t-* 规格。 */
    .poster .blk { position: absolute; z-index: 1; white-space: pre-wrap; }
    .poster .blk img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster .blk.image { outline: 1px solid rgba(43,41,46,.18); outline-offset: -1px; }
    .poster .t-kicker  { font: 500 21px var(--mono); letter-spacing: .2em; color: var(--c-blue); }
    .poster .t-title   { font-family: var(--serif-zh); font-size: 52px; font-weight: 500; line-height: 1.25; color: var(--ink); }
    .poster .t-body    { font-family: var(--serif-zh); font-size: 29px; font-weight: 400; line-height: 1.65; color: #2A292E; }
    .poster .t-caption { font: 19px var(--mono); color: var(--muted); }
    .poster .t-callout { font-family: var(--serif-zh); font-size: 29px; line-height: 1.55; color: #2A292E;
                         border-left: 3px solid var(--c-blue); background: rgba(119,170,194,.10); padding: 16px 22px; }
    .poster .t-footer  { font: 18px var(--mono); color: var(--muted); border-top: 1px solid rgba(43,41,46,.22); padding-top: 12px; }
  </style>
  <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?3caa4afc00730bf5e184910dff0e9f52";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
</head>
<body>
  <main class="sheet" id="sheet"></main>
  <script src="layout.js"></script>
  <script>
    /* 由 layout.js 生成 12 个 .poster.xhs（绝对定位 block），必须在 flip-viewer.js 之前执行 */
    (function () {
      var sheet = document.getElementById('sheet');
      window.LAYOUT.pages.forEach(function (pg, i) {
        var sec = document.createElement('section');
        sec.className = 'poster xhs';
        sec.id = 'xhs-' + String(i + 1).padStart(2, '0');
        var grain = document.createElement('div');
        grain.className = 'grain';
        sec.appendChild(grain);
        pg.blocks.forEach(function (bk) {
          var el = document.createElement('div');
          el.className = 'blk t-' + bk.t;
          el.style.left = bk.x + 'px';
          el.style.top = bk.y + 'px';
          el.style.width = bk.w + 'px';
          if (bk.h) el.style.height = bk.h + 'px';
          if (bk.fs) el.style.fontSize = bk.fs + 'px';
          if (bk.t === 'image') {
            var img = document.createElement('img');
            img.src = bk.src;
            img.alt = '';
            sec.appendChild(el).appendChild(img);
          } else {
            el.textContent = bk.text || '';
            sec.appendChild(el);
          }
        });
        sheet.appendChild(sec);
      });
    })();
  </script>
  <script src="../../../shared/magazine-bg-webgl.js"></script>
  <script src="../../../shared/flip-viewer.js"></script>
</body>
</html>
